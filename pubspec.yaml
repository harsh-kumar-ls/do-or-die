name: do_or_die
description: "A new Flutter project."
publish_to: 'none'
version: 0.9.3+16

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_local_notifications: ^22.3.2
  flutter_soloud: ^5.2.1
  flutter_timezone: ^5.1.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  # In-memory preferences for testing PrefsGameStore (already a transitive
  # dependency of shared_preferences).
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true

  # Original sound effects, synthesized by tools/gen_sfx.py.
  assets:
    - assets/sfx/

  # Both fonts are SIL Open Font License 1.1; licences in assets/fonts.
  fonts:
    - family: ChakraPetch
      fonts:
        - asset: assets/fonts/ChakraPetch-Medium.ttf
          weight: 500
        - asset: assets/fonts/ChakraPetch-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ChakraPetch-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf

# Launcher icon: the System emblem (built by tools/build_brand.py).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: design/brand/icon.png
  adaptive_icon_background: "#05070D"
  adaptive_icon_foreground: design/brand/foreground.png
  web:
    generate: true
    image_path: design/brand/icon.png
    background_color: "#05070D"
    theme_color: "#05070D"
