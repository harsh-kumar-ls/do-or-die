<!doctype html><html><body style="margin:0;background:#05070D;display:flex;gap:12px;flex-wrap:wrap;padding:12px">
<script>
// ?v=kind:colour,...  kind = player | fitness | personality | focus
const q=new URLSearchParams(location.search);
for(const item of (q.get('v')||'player:#4FB3FF').split(',')){
  const [kind,col]=item.split(':');
  const d=document.createElement('div');
  d.style.cssText='width:380px;height:380px;background:radial-gradient(circle at 50% 38%,#0B1730,#05070D 70%);position:relative';
  const layer=(src)=>{const i=document.createElement('img');i.src=src+'?'+Date.now();i.style.cssText='position:absolute;inset:0;width:100%;height:100%';d.appendChild(i);};
  const glow=(src)=>{const g=document.createElement('div');g.style.cssText=`position:absolute;inset:0;background:${col};-webkit-mask:url(${src}?${Date.now()}) center/100% 100% no-repeat;filter:drop-shadow(0 0 3px ${col}) drop-shadow(0 0 9px ${col})`;d.appendChild(g);};
  layer('base.svg'); if(kind!=='player') layer(kind+'.svg');
  if(kind!=='focus') glow('glow.svg'); else glow('glow.svg');
  if(kind!=='player') glow(kind+'_glow.svg');
  document.body.appendChild(d);
}
</script></body></html>
