<svg xmlns="http://www.w3.org/2000/svg" viewBox="76 56 360 360">
  <!-- Glow layer: tinted and pulsed by the app. White = full glow. -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- HUD lens over the left eye -->
    <polygon points="204,207 256,203 259,232 208,237" stroke-width="2"/>
    <line x1="204" y1="214" x2="196" y2="212" stroke-width="2"/>
    <line x1="214" y1="231" x2="226" y2="230" stroke-width="1"/>
    <line x1="240" y1="210" x2="252" y2="209" stroke-width="1"/>
    <!-- jacket seams -->
    <polyline points="262,352 288,512" stroke-width="2"/>
    <polyline points="172,362 196,420 176,512" stroke-width="1.2"/>
    <polyline points="348,360 340,430 352,512" stroke-width="1.2"/>
    <polyline points="206,374 244,352" stroke-width="1.2"/>
    <polyline points="330,370 284,352" stroke-width="1.2"/>
    <!-- buckle frame -->
    <polygon points="246,380 260,375 265,387 251,392" stroke-width="1.3"/>
    <!-- rim light along the right edge -->
    <polyline points="318,190 316,236 300,282 268,306" stroke-width="1.4" stroke-opacity=".7"/>
    <polyline points="344,124 338,162 324,194" stroke-width="1.4" stroke-opacity=".7"/>
    <polyline points="348,360 394,398 410,512" stroke-width="1.6" stroke-opacity=".8"/>
  </g>
  <g fill="#FFFFFF">
    <polygon points="208,208 255,204 258,231 210,236" fill-opacity=".16"/>
    <!-- the right eye's iris glow -->
    <polygon points="279,216 289,215 287,220 280,221"/>
    <!-- left eye behind the lens -->
    <polygon points="228,220 238,219 236,224 229,225"/>
    <!-- chest emblem -->
    <polygon points="216,389 223,396 216,403 209,396"/>
  </g>
</svg>
